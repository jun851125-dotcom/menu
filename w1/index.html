<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>蕭福星 | 資訊組長 - 個人介紹</title>
    <!-- Premium Typography (Inter & Noto Sans TC) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons for clean visuals -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Floating Background Glowing Halos -->
    <div class="background-glows">
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
        <div class="glow-orb orb-3"></div>
    </div>

    <!-- Main Container -->
    <main class="container">
        <!-- 3D Float Personal Card -->
        <div class="profile-card" id="profile-card">
            <!-- Card Glow Border Hack (using before/after mask in CSS) -->
            <div class="card-content">
                <!-- Profile Image Area -->
                <div class="avatar-container">
                    <div class="avatar-wrapper">
                        <img id="avatar" src="s06.png" alt="蕭福星的大頭貼">
                        <label for="file-input" class="upload-btn" title="更換大頭貼">
                            <i data-lucide="plus"></i>
                        </label>
                        <input type="file" id="file-input" accept="image/*">
                    </div>
                </div>

                <!-- Info Section -->
                <div class="info-section">
                    <div class="badge-container">
                        <span class="job-badge">
                            <i data-lucide="shield-check"></i>
                            資訊組長
                        </span>
                    </div>
                    <h1 class="name">蕭福星</h1>
                    <h2 class="sub-title">Shiao Fu-Hsing</h2>
                </div>

                <!-- Slogan Section -->
                <div class="slogan-section">
                    <p class="slogan">
                        帶領學生跨越<span class="highlight">程式高牆</span>，打造專屬 <span class="highlight">AI 品牌</span>。
                    </p>
                </div>

                <!-- Action Button -->
                <div class="action-section">
                    <button class="btn-primary" id="open-modal-btn">
                        <i data-lucide="mail"></i>
                        Email 聯絡
                    </button>
                </div>

                <!-- Social Links -->
                <div class="social-section">
                    <a href="https://www.facebook.com/lges3394" target="_blank" rel="noopener noreferrer" class="social-link" title="YouTube" aria-label="YouTube">
                        <i data-lucide="youtube"></i>
                    </a>
                    <a href="https://www.facebook.com/lges3394" target="_blank" rel="noopener noreferrer" class="social-link" title="Facebook" aria-label="Facebook">
                        <i data-lucide="facebook"></i>
                    </a>
                    <a href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer" class="social-link" title="Instagram" aria-label="Instagram">
                        <i data-lucide="instagram"></i>
                    </a>
                </div>
            </div>
        </div>
    </main>

    <!-- Interactive Contact Modal -->
    <div class="modal-overlay" id="contact-modal">
        <div class="modal-card">
            <button class="modal-close" id="close-modal-btn" aria-label="關閉">
                <i data-lucide="x"></i>
            </button>
            <h3 class="modal-title">聯絡資訊</h3>
            <p class="modal-desc">點擊下方按鈕即可快速複製資訊或撥打電話</p>
            
            <div class="contact-items">
                <!-- Phone -->
                <div class="contact-item">
                    <div class="contact-icon">
                        <i data-lucide="phone"></i>
                    </div>
                    <div class="contact-details">
                        <span class="contact-label">聯絡電話</span>
                        <span class="contact-value" id="phone-number">0911323316</span>
                    </div>
                    <div class="contact-actions">
                        <a href="tel:0911323316" class="action-icon-btn" title="撥打電話" aria-label="撥打電話">
                            <i data-lucide="phone-call"></i>
                        </a>
                        <button class="action-icon-btn copy-btn" data-copy-target="phone-number" title="複製電話" aria-label="複製電話">
                            <i data-lucide="copy"></i>
                        </button>
                    </div>
                </div>

                <!-- Email -->
                <div class="contact-item">
                    <div class="contact-icon">
                        <i data-lucide="mail"></i>
                    </div>
                    <div class="contact-details">
                        <span class="contact-label">電子信箱</span>
                        <span class="contact-value" id="email-address">lges3394@gmail.com</span>
                    </div>
                    <div class="contact-actions">
                        <a href="mailto:lges3394@gmail.com" class="action-icon-btn" title="寄送郵件" aria-label="寄送郵件">
                            <i data-lucide="send"></i>
                        </a>
                        <button class="action-icon-btn copy-btn" data-copy-target="email-address" title="複製信箱" aria-label="複製信箱">
                            <i data-lucide="copy"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast">已成功複製到剪貼簿</div>

    <script src="script.js"></script>
    <script>
        // Initialize Lucide Icons
        lucide.createIcons();
    </script>
</body>
</html>
