<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="展示今日開發的 12 個創意專案，涵蓋遊戲娛樂、實用工具、個人履歷、學習教育與視覺藝術等功能。">
  <title>2026-06-28 創作專案展示中心</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚀</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Ambient glowing blobs in background -->
  <div class="ambient-glows">
    <div class="glow-1"></div>
    <div class="glow-2"></div>
    <div class="glow-3"></div>
  </div>

  <div class="container">
    <!-- Header -->
    <header>
      <div class="logo-container">
        <h1>2026-06-28 創作成果展示中心</h1>
        <p class="subtitle">今日高效開發的 12 個精選專案！涵蓋多圖層畫板、霓虹打磚塊、打字射擊遊戲、Lo-Fi 音樂動畫，以及多語言卡通學習平台，點擊即可直接在線預覽與試玩。</p>
      </div>
    </header>

    <!-- Filters -->
    <div class="filter-wrapper">
      <button class="filter-btn active" data-filter="All">✨ 全部專案</button>
      <button class="filter-btn" data-filter="遊戲娛樂">🎮 遊戲娛樂</button>
      <button class="filter-btn" data-filter="實用工具">🛠️ 實用工具</button>
      <button class="filter-btn" data-filter="網頁設計">💎 網頁設計</button>
      <button class="filter-btn" data-filter="學習教育">🎓 學習教育</button>
      <button class="filter-btn" data-filter="視覺藝術">🎨 視覺藝術</button>
    </div>

    <!-- Project Grid -->
    <main id="project-grid" class="project-grid">
      <!-- Projects will be dynamically generated by JS -->
    </main>

    <!-- Footer -->
    <footer>
      <p>© 2026-06-28 創作成果集錦 | 由 <a href="https://github.com/google-deepmind" target="_blank">Google DeepMind Antigravity</a> 輔助設計與搭建</p>
    </footer>
  </div>

  <!-- Interactive Sandbox Overlay -->
  <div id="sandbox" class="sandbox-overlay">
    <!-- Left Sidebar: Details -->
    <aside id="sandbox-sidebar" class="sandbox-sidebar">
      <!-- Dynamic details will be loaded here -->
    </aside>

    <!-- Right Area: Simulated Web Frame & Actions -->
    <section class="sandbox-main">
      <!-- Toolbar -->
      <nav class="sandbox-navbar">
        <!-- Device Toggles -->
        <div class="device-toggles">
          <button class="device-btn active" data-device="desktop">💻 電腦</button>
          <button class="device-btn" data-device="tablet">📟 平板</button>
          <button class="device-btn" data-device="mobile">📱 手機</button>
        </div>

        <!-- Simulated Address Bar -->
        <div class="address-bar">
          <span class="address-bar-icon">🔒</span>
          <span id="address-url">http://localhost:3000/w1/index.html</span>
        </div>

        <!-- Utility Buttons -->
        <div class="sandbox-nav-actions">
          <a href="#" id="open-new-tab" target="_blank" class="btn btn-secondary" title="在新分頁打開">
            在新分頁開啟 ↗
          </a>
          <button id="close-sandbox" class="btn btn-primary" title="關閉預覽">
            關閉預覽 ✕
          </button>
        </div>
      </nav>

      <!-- Viewport Simulator -->
      <div class="sandbox-viewport-container">
        <div id="viewport-frame" class="viewport-frame device-desktop">
          <iframe id="sandbox-iframe" src="about:blank" allow="autoplay; clipboard-write; encrypted-media; geolocation; microphone; camera"></iframe>
        </div>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
