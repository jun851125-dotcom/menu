<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Learn! 英語學習樂園</title>
  
  <!-- Mobile & PWA Settings -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="英語學習樂園">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#58cc02">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%2358cc02%22 rx=%2220%22/><text x=%2215%22 y=%2275%22 font-size=%2270%22>🦉</text></svg>">

  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦉</text></svg>">
</head>
<body>

  <!-- Header Section with stats -->
  <header>
    <div class="user-stats">
      <div class="stat-item xp" title="經驗值 (XP)">
        <span>⭐</span>
        <span id="header-xp">0</span> XP
      </div>
      <div class="stat-item diamonds" title="藍色寶石">
        <span>💎</span>
        <span id="header-diamonds">5</span>
      </div>
      <div class="stat-item streak" title="每日練習連續天數">
        <span>🔥</span>
        <span id="header-streak">1</span> 天
      </div>
    </div>
    
    <div class="xp-progress-container">
      <div class="xp-bar-bg">
        <div class="xp-bar-fill" id="header-xp-bar"></div>
      </div>
      <span class="xp-bar-text" id="header-level-name">等級 1</span>
    </div>

    <button class="btn-reset" id="btn-reset-progress" title="重設學習進度">
      🔄
    </button>
  </header>

  <!-- Main Game Panel -->
  <main>
    
    <!-- Screen 1: Dashboard Map -->
    <section class="screen active" id="screen-map">
      <h1 class="map-title">學習地圖</h1>
      
      <!-- Mascot Greeting -->
      <div class="mascot-container">
        <!-- SVG Mascot: Oliver the Owl -->
        <svg class="mascot-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <!-- Feet -->
          <path d="M 38 82 Q 40 86 42 82 M 34 82 Q 36 86 38 82 M 42 82 Q 44 86 46 82" stroke="#ff9600" stroke-width="3" stroke-linecap="round" fill="none" />
          <path d="M 58 82 Q 60 86 62 82 M 54 82 Q 56 86 58 82 M 62 82 Q 64 86 66 82" stroke="#ff9600" stroke-width="3" stroke-linecap="round" fill="none" />
          
          <!-- Body & Head -->
          <ellipse cx="50" cy="52" rx="26" ry="32" fill="#58cc02" />
          <ellipse cx="50" cy="55" rx="18" ry="24" fill="#ffffff" />
          
          <!-- Chest Feathers -->
          <path d="M 46 48 L 50 51 L 54 48" stroke="#58cc02" stroke-width="2" fill="none" stroke-linecap="round" />
          <path d="M 42 56 L 46 59 L 50 56 M 50 56 L 54 59 L 58 56" stroke="#58cc02" stroke-width="2" fill="none" stroke-linecap="round" />
          <path d="M 46 64 L 50 67 L 54 64" stroke="#58cc02" stroke-width="2" fill="none" stroke-linecap="round" />
          
          <!-- Ears / Tufts -->
          <polygon points="26,30 38,26 32,40" fill="#46a302" />
          <polygon points="74,30 62,26 68,40" fill="#46a302" />
          
          <!-- Wings -->
          <path d="M 24 45 C 16 50, 16 65, 24 70 Z" fill="#46a302" />
          <path d="M 76 45 C 84 50, 84 65, 76 70 Z" fill="#46a302" />
          
          <!-- Eyes -->
          <!-- Left Eye -->
          <circle cx="40" cy="38" r="11" fill="#ffc800" stroke="#2d3436" stroke-width="2" />
          <circle cx="40" cy="38" r="8" fill="#ffffff" />
          <circle cx="41" cy="38" r="4.5" fill="#2d3436" />
          <circle cx="39" cy="36" r="1.5" fill="#ffffff" />
          
          <!-- Right Eye -->
          <circle cx="60" cy="38" r="11" fill="#ffc800" stroke="#2d3436" stroke-width="2" />
          <circle cx="60" cy="38" r="8" fill="#ffffff" />
          <circle cx="59" cy="38" r="4.5" fill="#2d3436" />
          <circle cx="58" cy="36" r="1.5" fill="#ffffff" />
          
          <!-- Glasses Bridge -->
          <rect x="49" y="37" width="2" height="2" fill="#2d3436" />
          
          <!-- Beak -->
          <polygon points="50,44 46,49 54,49" fill="#ff9600" />
        </svg>
        <div class="mascot-bubble" id="mascot-speech">
          Hello! 我是貓頭鷹 Oliver。今天想學習哪一個關卡呢？點擊圓圈開始吧！
        </div>
      </div>

      <!-- Level Map Path Nodes -->
      <div class="level-path" id="level-nodes-container">
        <!-- Dynamically filled by JavaScript -->
      </div>
    </section>

    <!-- Screen 2: Flashcard Study Room -->
    <section class="screen" id="screen-study">
      <div class="study-header">
        <button class="btn-cartoon gray" id="study-btn-back">⬅️ 返回</button>
        <div class="study-title" id="study-unit-title">學習單字</div>
        <div class="study-progress" id="study-progress-text">1 / 10</div>
      </div>

      <!-- Flipped Card Container -->
      <div class="card-container">
        <div class="flashcard" id="study-flashcard">
          <!-- Front Side -->
          <div class="card-face front">
            <div class="card-emoji" id="study-card-emoji">👋</div>
            <div class="card-word" id="study-card-english">Hello</div>
            <div class="card-audio-hint">🔊 點擊發音</div>
          </div>
          <!-- Back Side -->
          <div class="card-face back">
            <div class="card-translation" id="study-card-translation">你好</div>
            <div class="card-hint-text" id="study-card-hint">常用打招呼用語。</div>
          </div>
        </div>
      </div>

      <!-- Controls -->
      <div class="study-nav-controls">
        <button class="btn-cartoon gray" id="study-btn-prev" style="flex: 1;">上一個</button>
        <button class="btn-cartoon primary" id="study-btn-flip" style="flex: 1.5;">翻轉卡片 🔄</button>
        <button class="btn-cartoon secondary" id="study-btn-next" style="flex: 1;">下一個</button>
      </div>
    </section>

    <!-- Screen 3: Challenge Quiz -->
    <section class="screen" id="screen-quiz">
      <div class="quiz-header">
        <div class="quiz-progress-row">
          <button class="quiz-close-btn" id="quiz-btn-close">✖</button>
          <div class="quiz-progress-bar-bg">
            <div class="quiz-progress-bar-fill" id="quiz-progress-bar"></div>
          </div>
          <div class="hearts-container" id="quiz-hearts">
            ❤️ ❤️ ❤️
          </div>
        </div>
        <div class="quiz-question-type" id="quiz-question-type-label">聽力選擇題</div>
        <div class="quiz-prompt" id="quiz-prompt-text">聽發音，選出正確的單字：</div>
      </div>

      <!-- Quiz Content Area -->
      <div class="quiz-body" id="quiz-body-container">
        <!-- Multiple Choice Grid (Dynamic) -->
        <div class="options-grid" id="quiz-options-container">
          <!-- E.g. Cards filled by JS -->
        </div>
        
        <!-- Word Puzzle Tray (Dynamic) -->
        <div id="quiz-puzzle-container" style="display: none;">
          <div class="sentence-tray" id="quiz-sentence-tray">
            <!-- Words arranged by player -->
          </div>
          <div class="word-reservoir" id="quiz-word-reservoir">
            <!-- Word reservoir chips -->
          </div>
        </div>

        <!-- Listening Speaker Center (Dynamic) -->
        <div class="listening-prompt-container" id="quiz-listening-container" style="display: none;">
          <button class="btn-speaker-big" id="quiz-speaker-btn">
            🔊
            <div class="listening-pulse-ring"></div>
          </button>
        </div>
      </div>

      <!-- Bottom Checker / Evaluation Panel -->
      <div class="quiz-checker-panel" id="quiz-checker-panel">
        <div class="checker-content">
          <!-- Message block when answered -->
          <div class="feedback-message" id="checker-feedback">
            <div class="feedback-icon" id="checker-feedback-icon">✔</div>
            <div class="feedback-text-wrapper">
              <span class="feedback-title" id="checker-feedback-title">答對了！</span>
              <span class="feedback-detail" id="checker-feedback-detail">非常好，繼續保持！</span>
            </div>
          </div>
          <!-- Action Button -->
          <button class="btn-cartoon primary" id="quiz-btn-action" style="min-width: 140px;">檢查</button>
        </div>
      </div>
    </section>

    <!-- Screen 4: Victory / Level Completed -->
    <section class="screen" id="screen-victory">
      <div class="victory-card">
        <h2 class="victory-title">太棒了！🎉</h2>
        <p class="victory-subtitle" id="victory-subtitle-text">你順利完成了這個挑戰！</p>
        
        <!-- Dancing Owl Mascot -->
        <svg class="victory-mascot" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <!-- Feet -->
          <path d="M 38 82 Q 40 86 42 82 M 34 82 Q 36 86 38 82 M 42 82 Q 44 86 46 82" stroke="#ff9600" stroke-width="3" stroke-linecap="round" fill="none" />
          <path d="M 58 82 Q 60 86 62 82 M 54 82 Q 56 86 58 82 M 62 82 Q 64 86 66 82" stroke="#ff9600" stroke-width="3" stroke-linecap="round" fill="none" />
          
          <!-- Body & Head -->
          <ellipse cx="50" cy="52" rx="26" ry="32" fill="#58cc02" />
          <ellipse cx="50" cy="55" rx="18" ry="24" fill="#ffffff" />
          
          <!-- Chest Feathers -->
          <path d="M 46 48 L 50 51 L 54 48" stroke="#58cc02" stroke-width="2" fill="none" stroke-linecap="round" />
          <path d="M 42 56 L 46 59 L 50 56 M 50 56 L 54 59 L 58 56" stroke="#58cc02" stroke-width="2" fill="none" stroke-linecap="round" />
          
          <!-- Ears / Tufts -->
          <polygon points="26,30 38,26 32,40" fill="#46a302" />
          <polygon points="74,30 62,26 68,40" fill="#46a302" />
          
          <!-- Celebrating Wings -->
          <path d="M 24 50 C 14 45, 14 30, 24 25 Z" fill="#46a302" transform="rotate(-20 24 50)" />
          <path d="M 76 50 C 86 45, 86 30, 76 25 Z" fill="#46a302" transform="rotate(20 76 50)" />
          
          <!-- Happy Squinty Eyes -->
          <!-- Left Eye -->
          <circle cx="40" cy="38" r="11" fill="#ffc800" stroke="#2d3436" stroke-width="2" />
          <path d="M 34 38 Q 40 32 46 38" stroke="#2d3436" stroke-width="3" fill="none" stroke-linecap="round" />
          <!-- Right Eye -->
          <circle cx="60" cy="38" r="11" fill="#ffc800" stroke="#2d3436" stroke-width="2" />
          <path d="M 54 38 Q 60 32 66 38" stroke="#2d3436" stroke-width="3" fill="none" stroke-linecap="round" />
          
          <!-- Glasses Bridge -->
          <rect x="49" y="37" width="2" height="2" fill="#2d3436" />
          
          <!-- Beak -->
          <polygon points="50,44 46,49 54,49" fill="#ff9600" />
        </svg>

        <!-- Rewards -->
        <div class="rewards-showcase">
          <div class="reward-bubble xp">
            <span style="font-size: 1.5rem;">⭐</span>
            <span class="reward-val xp" id="victory-xp-gain">+10</span>
            <span class="reward-label">經驗值</span>
          </div>
          <div class="reward-bubble diamonds">
            <span style="font-size: 1.5rem;">💎</span>
            <span class="reward-val diamonds" id="victory-diamonds-gain">+3</span>
            <span class="reward-label">藍色寶石</span>
          </div>
        </div>

        <div class="victory-actions">
          <button class="btn-cartoon primary" id="victory-btn-continue">返回地圖</button>
          <button class="btn-cartoon secondary" id="victory-btn-replay">再練習一次</button>
        </div>
      </div>
    </section>

  </main>

  <!-- Level Selected Popover (Unit Drawer) -->
  <div class="overlay" id="popover-overlay"></div>
  <div class="level-popover" id="level-popover">
    <div class="popover-header">
      <div class="popover-title-row">
        <span class="popover-icon" id="popover-level-icon">🎒</span>
        <div>
          <h3 class="popover-title" id="popover-level-title">關卡標題</h3>
          <span style="font-size: 0.85rem; color: var(--color-purple); font-weight: bold;" id="popover-level-subtitle">LEVEL 1</span>
        </div>
      </div>
      <button class="popover-close" id="popover-btn-close">✖</button>
    </div>
    <p class="popover-desc" id="popover-level-desc">關卡描述說明文字...</p>
    
    <div class="popover-actions">
      <button class="btn-cartoon secondary" id="popover-btn-study">
        📖 單字卡學習
      </button>
      <button class="btn-cartoon primary" id="popover-btn-quiz">
        ⚡ 挑戰測驗
      </button>
      <button class="btn-cartoon gray full-width" id="popover-btn-advance">
        👑 覺得學夠了？直接晉級
      </button>
    </div>
  </div>

  <!-- Scripts -->
  <script src="vocab.js"></script>
  <script src="audio.js"></script>
  <script src="app.js"></script>
</body>
</html>
